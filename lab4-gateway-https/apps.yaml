---
apiVersion: v1
kind: Namespace
metadata:
  name: lab4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-html
  namespace: lab4
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Secure Gateway App</title></head>
    <body style="background:#bf360c;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
      <div style="text-align:center">
        <h1>🔐 Secure Gateway App</h1>
        <p>Lab 4 — Gateway API HTTPS</p>
        <p>TLS terminated at the Gateway!</p>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: lab4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: webapp-html
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: lab4
spec:
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 80
