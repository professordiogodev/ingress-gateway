---
# HTTPRoute that redirects HTTP → HTTPS.
# Attaches to the "http" listener on the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: ${STUDENT_NAME}
spec:
  parentRefs:
    - name: ${STUDENT_NAME}-gateway
      namespace: ${STUDENT_NAME}
      sectionName: http
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# HTTPRoute for HTTPS traffic.
# Attaches to the "https" listener on the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-https
  namespace: ${STUDENT_NAME}
spec:
  parentRefs:
    - name: ${STUDENT_NAME}-gateway
      namespace: ${STUDENT_NAME}
      sectionName: https
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: webapp
          port: 80
