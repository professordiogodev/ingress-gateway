---
# Attaches to the HTTP listener → redirects all traffic to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: lab4
spec:
  parentRefs:
    - name: my-gateway
      namespace: lab4
      # sectionName targets a specific listener by its name field.
      # Without this, the route would attach to both listeners, breaking the redirect.
      sectionName: http
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Attaches to the HTTPS listener → forwards traffic to the webapp.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-https
  namespace: lab4
spec:
  parentRefs:
    - name: my-gateway
      namespace: lab4
      sectionName: https
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: webapp
          port: 80
