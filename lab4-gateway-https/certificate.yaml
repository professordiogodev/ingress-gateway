---
# cert-manager Certificate resource.
# This explicitly requests a TLS certificate and stores it in a Secret.
# The Gateway (gateway-tls.yaml) then references that Secret for TLS termination.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${STUDENT_NAME}-tls
  namespace: ${STUDENT_NAME}
spec:
  secretName: ${STUDENT_NAME}-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ${STUDENT_NAME}.eks.ironlabs.online
