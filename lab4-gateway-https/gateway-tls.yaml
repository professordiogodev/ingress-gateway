---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: lab4
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ${STUDENT_NAME}.eks.ironlabs.online
spec:
  gatewayClassName: nginx
  listeners:
    # ── HTTP listener: receives plain HTTP, used only for redirect ─────────────
    - name: http
      port: 80
      protocol: HTTP
      hostname: "${STUDENT_NAME}.eks.ironlabs.online"
      allowedRoutes:
        namespaces:
          from: Same

    # ── HTTPS listener: terminates TLS using the cert-manager Secret ──────────
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "${STUDENT_NAME}.eks.ironlabs.online"
      tls:
        # Terminate: the Gateway decrypts TLS and forwards plain HTTP to backends.
        # Alternative is Passthrough: forwards encrypted traffic to pods (for mTLS).
        mode: Terminate
        certificateRefs:
          # This Secret is created by cert-manager (see certificate.yaml).
          - name: webapp-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
