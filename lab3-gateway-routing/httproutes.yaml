---
# PATH-BASED routing via HTTPRoute.
# A single hostname, different paths routed to different services.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-routing
  namespace: ${STUDENT_NAME}
spec:
  parentRefs:
    - name: ${STUDENT_NAME}-gateway
      namespace: ${STUDENT_NAME}
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /blue
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: app-blue
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /green
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: app-green
          port: 80
---
# HOST-BASED (subdomain) routing via HTTPRoute.
# Different hostnames attach to the same Gateway listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subdomain-blue
  namespace: ${STUDENT_NAME}
spec:
  parentRefs:
    - name: ${STUDENT_NAME}-gateway
      namespace: ${STUDENT_NAME}
  hostnames:
    - "blue.${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: app-blue
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subdomain-green
  namespace: ${STUDENT_NAME}
spec:
  parentRefs:
    - name: ${STUDENT_NAME}-gateway
      namespace: ${STUDENT_NAME}
  hostnames:
    - "green.${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: app-green
          port: 80
