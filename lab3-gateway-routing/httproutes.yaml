---
# PATH-BASED routing: one hostname, different paths → different backends.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-routing
  namespace: lab3
spec:
  parentRefs:
    - name: my-gateway
      namespace: lab3
  hostnames:
    - "${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /blue
      filters:
        # URLRewrite strips /blue before forwarding to the backend.
        # This is the Gateway API equivalent of nginx's rewrite-target annotation —
        # but it's standardized and works the same on any Gateway API implementation.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: app-blue
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /green
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: app-green
          port: 80
---
# HOST-BASED routing: blue subdomain → blue app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subdomain-blue
  namespace: lab3
spec:
  parentRefs:
    - name: my-gateway
      namespace: lab3
  hostnames:
    - "blue.${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: app-blue
          port: 80
---
# HOST-BASED routing: green subdomain → green app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subdomain-green
  namespace: lab3
spec:
  parentRefs:
    - name: my-gateway
      namespace: lab3
  hostnames:
    - "green.${STUDENT_NAME}.eks.ironlabs.online"
  rules:
    - backendRefs:
        - name: app-green
          port: 80
