---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: lab3
  annotations:
    # external-dns reads this annotation to know which DNS records to create.
    # It creates CNAMEs pointing at this Gateway's NLB for each listed hostname.
    external-dns.alpha.kubernetes.io/hostname: >-
      ${STUDENT_NAME}.eks.ironlabs.online,
      blue.${STUDENT_NAME}.eks.ironlabs.online,
      green.${STUDENT_NAME}.eks.ironlabs.online
spec:
  # References the GatewayClass installed during setup.
  # This tells Kubernetes which controller (NGINX Gateway Fabric) manages this Gateway.
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Only allow HTTPRoutes from this same namespace to attach.
      # Change to "All" if you want cross-namespace routes.
      allowedRoutes:
        namespaces:
          from: Same
