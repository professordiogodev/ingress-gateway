---
# A Gateway defines a load balancer entry point.
# It references a GatewayClass (the controller) and declares which hostnames
# and ports it accepts traffic on. The cluster admin (instructor) manages
# GatewayClasses; developers manage Gateways and HTTPRoutes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${STUDENT_NAME}-gateway
  namespace: ${STUDENT_NAME}
  annotations:
    # external-dns will create DNS records for the hostnames listed below.
    external-dns.alpha.kubernetes.io/hostname: >-
      ${STUDENT_NAME}.eks.ironlabs.online,
      blue.${STUDENT_NAME}.eks.ironlabs.online,
      green.${STUDENT_NAME}.eks.ironlabs.online
spec:
  # "nginx" is the GatewayClass created by the instructor using NGINX Gateway Fabric.
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      # Allow HTTPRoutes from the same namespace to attach to this Gateway.
      allowedRoutes:
        namespaces:
          from: Same
