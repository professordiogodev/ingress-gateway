---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-tls
  namespace: lab2
  annotations:
    # Triggers cert-manager to request a certificate from this ClusterIssuer.
    # cert-manager watches for this annotation, creates a Certificate object,
    # solves the DNS-01 challenge via Route53, and stores the cert in a Secret.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NGINX returns HTTP 308 for any HTTP request, redirecting to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${STUDENT_NAME}.eks.ironlabs.online
      # cert-manager creates and manages this Secret automatically.
      # The name here is the contract: cert-manager writes it, NGINX reads it.
      secretName: ${STUDENT_NAME}-tls-secret
  rules:
    - host: ${STUDENT_NAME}.eks.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
