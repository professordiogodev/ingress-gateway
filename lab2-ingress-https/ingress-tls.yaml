---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-tls
  namespace: ${STUDENT_NAME}
  annotations:
    # Tell cert-manager to automatically issue a certificate from this ClusterIssuer.
    # The instructor pre-created "letsencrypt-prod" — you just reference it here.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Redirect all HTTP traffic to HTTPS automatically.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${STUDENT_NAME}.eks.ironlabs.online
      # cert-manager will create/manage this Secret automatically.
      secretName: ${STUDENT_NAME}-tls-secret
  rules:
    - host: ${STUDENT_NAME}.eks.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80
