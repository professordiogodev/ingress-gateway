---
# PATH-BASED routing: one hostname, different URL paths → different backends.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing
  namespace: lab1
  annotations:
    # Strip the path prefix before forwarding to the backend.
    # Without this, /blue is forwarded as-is but nginx only serves /.
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: ${STUDENT_NAME}.eks.ironlabs.online
      http:
        paths:
          - path: /blue
            pathType: Prefix
            backend:
              service:
                name: app-blue
                port:
                  number: 80
          - path: /green
            pathType: Prefix
            backend:
              service:
                name: app-green
                port:
                  number: 80
---
# HOST-BASED (subdomain) routing: different hostnames → different backends.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: subdomain-routing
  namespace: lab1
spec:
  ingressClassName: nginx
  rules:
    - host: blue.${STUDENT_NAME}.eks.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-blue
                port:
                  number: 80
    - host: green.${STUDENT_NAME}.eks.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-green
                port:
                  number: 80
